<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0d0118"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7b1fa2"/>
      <stop offset="50%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="coin1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="coin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#bf94ff"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Outer gradient ring -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#ring)" stroke-width="24" opacity="0.6"/>

  <!-- Inner circle -->
  <circle cx="512" cy="512" r="320" fill="#1e0740" opacity="0.8"/>

  <!-- Split line -->
  <line x1="512" y1="220" x2="512" y2="800" stroke="url(#ring)" stroke-width="6" stroke-dasharray="20,12" opacity="0.5"/>

  <!-- Left coin (gold) -->
  <circle cx="340" cy="480" r="120" fill="url(#coin1)" filter="url(#glow)"/>
  <circle cx="340" cy="480" r="100" fill="none" stroke="#fbbf24" stroke-width="8"/>
  <text x="340" y="505" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#78350f">₱</text>

  <!-- Right coin (purple) -->
  <circle cx="684" cy="545" r="100" fill="url(#coin2)" filter="url(#glow)"/>
  <circle cx="684" cy="545" r="84" fill="none" stroke="#bf94ff" stroke-width="6"/>
  <text x="684" y="568" font-family="Arial Black, sans-serif" font-size="66" font-weight="900" text-anchor="middle" fill="#ede0ff">₱</text>

  <!-- Arrow left-right (split symbol) -->
  <path d="M440 512 L580 512" stroke="url(#ring)" stroke-width="10" stroke-linecap="round"/>
  <polygon points="572,496 592,512 572,528" fill="#ec4899"/>
  <polygon points="448,496 428,512 448,528" fill="#3b82f6"/>

  <!-- Bottom text: SPLITZY -->
  <text x="512" y="840" font-family="Arial Black, sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="url(#ring)" letter-spacing="-2">SPLITZY</text>
</svg>
